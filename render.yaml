services:
  - type: web
    name: playboy-manor-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: playboy-manor-db
          property: connectionString

databases:
  - name: playboy-manor-db
    plan: free
    databaseName: playboy_manor
    user: playboy_manager
